services:
  web:
    build: .
    container_name: gcu-web
    restart: unless-stopped
    volumes:
      # Contact form submissions (JSON lines). See src/pages/api/contact.ts.
      - gcu-data:/app/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # Main router: gravelclub-ulm.de
      - "traefik.http.routers.gcu-web.rule=Host(`gravelclub-ulm.de`)"
      - "traefik.http.routers.gcu-web.entrypoints=websecure"
      - "traefik.http.routers.gcu-web.tls.certresolver=myresolver"
      - "traefik.http.routers.gcu-web.service=gcu-web"

networks:
  traefik:
    external: true

volumes:
  gcu-data:
